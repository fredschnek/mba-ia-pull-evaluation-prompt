metadata:
  techniques:
    - "Role Prompting"
    - "Few-shot Learning"
    - "Chain of Thought"
    - "Skeleton of Thought"
  rationale: |
    - Role Prompting: persona de PM sênior eleva a barra de qualidade e dá contexto profissional.
    - Few-shot Learning: 3 exemplos cobrindo simples/médio/complexo ancoram formato e estilo (obrigatório).
    - Chain of Thought: passo a passo interno (persona → ação → valor → critérios) reduz omissões.
    - Skeleton of Thought: esqueleto fixo da saída garante formato consistente, vital para os scores de Clarity/Format.
