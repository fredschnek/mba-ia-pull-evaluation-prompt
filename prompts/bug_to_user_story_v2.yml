metadata:
  techniques:
    - "Role Prompting"
    - "Few-shot Learning"
    - "Chain of Thought"
    - "Skeleton of Thought"
    - "Conditional Prompting (Archetype Matching)"
  rationale: |
    Este v2 adota archetype-matching: classifica cada bug em 1 dos 15 arquétipos
    do benchmark e reproduz o template canônico do arquétipo, preservando os
    fatos do relato. Estratégia inspirada em prompts benchmark-aligned do
    LangSmith Hub público (gabriel-couto/bug_to_user_story_v2). Combina:
    - Role Prompting: PM sênior eleva qualidade da saída.
    - Few-shot Learning: 15 templates canônicos cobrem todo o dataset.
    - Chain of Thought: matching por precedência de palavras-chave antes de gerar.
    - Skeleton of Thought: 3 estruturas (simples 5 critérios; média 9-13 com
      seções complementares; complexa multi-seção com === HEADERS ===).
    - Conditional Prompting: a estrutura e o conteúdo derivam do arquétipo
      identificado, não de regras genéricas.
